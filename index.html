<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบจองรถส่วนกลาง | อบต.คำโตนด</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== ฟอนต์ราชการสำหรับหน้าพิมพ์ ===== */
@font-face{font-family:'TH SarabunIT9';
  src:local('TH SarabunIT๙'),local('TH SarabunIT9'),local('THSarabunIT9'),
      local('TH SarabunPSK'),local('TH Sarabun New'),
      url('fonts/THSarabunIT9.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'TH SarabunIT9';
  src:local('TH SarabunIT๙ Bold'),local('THSarabunIT9 Bold'),local('TH SarabunPSK Bold'),
      url('fonts/THSarabunIT9-Bold.ttf') format('truetype');
  font-weight:700;font-style:normal;font-display:swap}

:root{--bg:#f1f5f9;--pri:#1d4ed8;--pri2:#3b82f6;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;
      --info:#0891b2;--done:#64748b;--line:#e2e8f0;--tx:#0f172a;--mut:#64748b;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Sarabun,'Noto Sans Thai',system-ui,sans-serif;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 80px}
.top{background:linear-gradient(120deg,#1e3a8a,#2563eb);color:#fff;padding:18px 0}
.top .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0}
.top h1{font-size:20px;margin:0;line-height:1.3}
.top .sub{font-size:13px;opacity:.85}
.logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;
  background:var(--pri);color:#fff;display:inline-flex;gap:6px;align-items:center;transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.g{background:var(--ok)} .btn.r{background:var(--bad)} .btn.s{background:var(--done)}
.btn.o{background:#fff;color:var(--pri);border:1px solid rgba(255,255,255,.6)}
.card{background:#fff;border-radius:var(--r);box-shadow:0 2px 14px rgba(15,23,42,.07);padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:6px;background:#fff;border-radius:12px;padding:6px;overflow-x:auto;
  box-shadow:0 2px 14px rgba(15,23,42,.07);margin:16px 0}
.tabs button{flex:1;min-width:130px;border:0;background:transparent;padding:10px;border-radius:9px;
  font:inherit;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.car{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:.18s}
.car:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(15,23,42,.12);border-color:var(--pri2)}
.car h3{margin:0 0 2px;font-size:16px}
.plate{display:inline-block;background:#0f172a;color:#fff;border-radius:6px;padding:2px 10px;font-weight:700;font-size:13px;margin:6px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-ok{background:#dcfce7;color:#166534} .b-warn{background:#fef3c7;color:#92400e}
.b-bad{background:#fee2e2;color:#991b1b} .b-info{background:#cffafe;color:#155e75}
.b-done{background:#e2e8f0;color:#334155}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:#334155}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri2);box-shadow:0 0 0 3px #bfdbfe}
.f2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.f3{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:700px){.f2,.f3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f8fafc;font-size:13px;color:#475569;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#f8fafc}
.tw{overflow:auto;max-height:64vh;border:1px solid var(--line);border-radius:10px}
.empty{text-align:center;color:var(--mut);padding:38px 10px}
.hint{font-size:12px;color:var(--mut)}
.err{color:var(--bad);font-size:12.5px;margin-top:4px;display:none}
.err.on{display:block}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;padding:20px;z-index:1000;overflow:auto}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:720px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.modal .hd{background:var(--pri);color:#fff;padding:14px 18px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal .hd h2{margin:0;font-size:17px}
.modal .bd{padding:18px;max-height:66vh;overflow:auto}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{background:rgba(255,255,255,.2);border:0;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:18px}
#toastBox{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.2);transition:.25s;background:var(--ok);max-width:330px}
.toast.t-warn{background:var(--warn)} .toast.t-bad{background:var(--bad)} .toast.t-info{background:var(--info)}

/* ===== หน้าพิมพ์ แบบ ๓ : A4 บน1 ขวา2 ล่าง1 ซ้าย3 ซม. ===== */
#printRoot{display:none}
#printRoot .sheet{--fs:16pt;
  font-family:'TH SarabunIT9','TH SarabunPSK','TH Sarabun New',Sarabun,'Noto Sans Thai',sans-serif;
  font-size:var(--fs);line-height:1.42;color:#000;background:#fff;box-sizing:border-box}
#printRoot .form-no{text-align:right;font-weight:700;font-size:1.05em}
#printRoot .doc-title{text-align:center;font-weight:700;font-size:1.28em;margin:.15em 0 .6em}
#printRoot .date-line{text-align:right;margin-bottom:.45em;white-space:nowrap}
#printRoot .to-line{margin:.2em 0 .35em}
#printRoot .body-text{text-indent:2.5cm;text-align:justify;text-justify:inter-word;margin:0 0 .5em}
#printRoot .dl{display:inline-block;border-bottom:1px dotted #000;text-align:center;vertical-align:baseline;
  padding:0 .25em;min-width:2.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#printRoot .dl.f1{min-width:4.5em} #printRoot .dl.f2{min-width:7em} #printRoot .dl.f3{min-width:9.5em}
#printRoot .dl.fill{width:6.5cm} #printRoot .dl.w-50{width:1.4cm} #printRoot .dl.w-60{width:1.7cm}
#printRoot .dl.w-70{width:1.9cm} #printRoot .dl.w-90{width:2.4cm} #printRoot .dl.w-110{width:3.1cm}
#printRoot .cb{display:inline-block;width:1em;height:1em;border:1px solid #000;line-height:.95em;text-align:center;margin:0 .15em;font-weight:700}
#printRoot .sign-row{display:flex;gap:.6cm;margin-top:.9em;page-break-inside:avoid}
#printRoot .sign-box{flex:1;text-align:center;line-height:1.75}
#printRoot .sign-box .small{font-size:.92em}
#printRoot .mini-head{margin-top:1em;font-weight:700}
#printRoot .opt-line{margin:.15em 0 .1em}
#printRoot.preview{display:block;position:fixed;inset:0;z-index:9000;overflow:auto;background:#525659;padding:76px 0 24px}
#printRoot.preview .sheet{width:21cm;min-height:29.7cm;margin:0 auto 20px;padding:1cm 2cm 1cm 3cm;box-shadow:0 6px 28px rgba(0,0,0,.45)}
.pv-bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:9001;background:#1e293b;color:#fff;
  display:flex;align-items:center;gap:10px;padding:0 16px;overflow-x:auto}
.pv-bar select,.pv-bar button{font-family:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:0;cursor:pointer}
.pv-bar .sp{flex:1}
@media print{
  @page{size:A4 portrait;margin:1cm 2cm 1cm 3cm}
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  .pv-bar{display:none!important}
  #printRoot,#printRoot.preview{display:block!important;position:static!important;inset:auto!important;
    background:#fff!important;padding:0!important;overflow:visible!important}
  #printRoot.preview .sheet{width:auto!important;min-height:0!important;margin:0!important;padding:0!important;box-shadow:none!important}
}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="logo">🚗</div>
  <div style="flex:1">
    <h1>ระบบจองรถส่วนกลาง</h1>
    <div class="sub">องค์การบริหารส่วนตำบลคำโตนด</div>
  </div>
  <a class="btn o sm" href="admin.html">🔐 สำหรับเจ้าหน้าที่</a>
</div></div>

<div class="wrap">
  <div class="tabs" id="uTabs">
    <button class="on" data-t="book">🚙 จองรถ</button>
    <button data-t="mine">📋 ติดตามสถานะ</button>
    <button data-t="cal">📅 ตารางการใช้รถ</button>
  </div>

  <!-- ===== จองรถ ===== -->
  <section id="u-book">
    <div class="card" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
      <div style="flex:1;min-width:175px"><label>วันที่ต้องการใช้</label><input type="date" id="fDate"></div>
      <div style="flex:1;min-width:150px"><label>ประเภทรถ</label>
        <select id="fType"><option value="">ทุกประเภท</option>
          <option value="van">รถตู้</option><option value="pickup">รถบรรทุก 1 ตัน</option>
          <option value="water">รถน้ำ</option><option value="crane">รถเครน</option>
          <option value="waste">รถขยะ</option><option value="tractor">รถแทร็กเตอร์</option></select></div>
      <div style="flex:2;min-width:200px"><label>ค้นหา</label><input id="fKey" placeholder="ชื่อรถ / ทะเบียน / ยี่ห้อ"></div>
    </div>
    <div class="grid" id="carGrid"></div>
  </section>

  <!-- ===== ติดตามสถานะ ===== -->
  <section id="u-mine" hidden>
    <div class="card" style="display:flex;gap:12px;flex-wrap:wrap;align-items:end">
      <div style="flex:2;min-width:220px"><label>ค้นหา</label><input id="mKey" placeholder="ชื่อผู้ขอ / สถานที่ / ทะเบียน"></div>
      <div style="flex:1;min-width:160px"><label>สถานะ</label><select id="mSt"><option value="">ทุกสถานะ</option></select></div>
    </div>
    <div class="card"><div class="tw"><table>
      <thead><tr><th>วันที่ใช้</th><th>รถ</th><th>ผู้ขอ</th><th>สถานที่</th><th>สถานะ</th><th style="width:210px">จัดการ</th></tr></thead>
      <tbody id="mBody"></tbody></table></div></div>
  </section>

  <!-- ===== ตารางการใช้รถ ===== -->
  <section id="u-cal" hidden>
    <div class="card" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
      <div style="flex:1;min-width:200px"><label>เลือกวันที่</label><input type="date" id="cDate"></div>
      <button class="btn s sm" id="cPrev">← วันก่อน</button>
      <button class="btn s sm" id="cNext">วันถัดไป →</button>
    </div>
    <div class="card"><div class="tw"><table>
      <thead><tr><th>รถ / ทะเบียน</th><th>ช่วงเวลา</th><th>ผู้ขอใช้</th><th>สถานที่</th><th>ผู้ขับขี่</th><th>สถานะ</th></tr></thead>
      <tbody id="cBody"></tbody></table></div></div>
  </section>
</div>

<!-- ===== Modal จองรถ ===== -->
<div class="mask" id="mkBook"><form class="modal" id="frmBook" novalidate>
  <div class="hd"><h2 id="bkTitle">จองรถ</h2><button type="button" class="x" data-close>×</button></div>
  <div class="bd">
    <div class="f2">
      <div><label>ชื่อผู้ขอใช้รถ *</label><input name="userName" required maxlength="80"></div>
      <div><label>ตำแหน่ง *</label><input name="userPosition" required maxlength="80"></div>
    </div>
    <div class="f2" style="margin-top:12px">
      <div><label>วันที่ไป *</label><input type="date" name="date" required></div>
      <div><label>เวลาออก *</label><input type="time" name="startTime" required></div>
    </div>
    <div class="f2" style="margin-top:12px">
      <div><label>วันที่กลับ *</label><input type="date" name="returnDate" required></div>
      <div><label>เวลากลับ *</label><input type="time" name="endTime" required></div>
    </div>
    <div class="err" id="errTime">⚠️ เวลากลับต้องอยู่หลังเวลาออก</div>
    <div style="margin-top:12px"><label>สถานที่ปลายทาง *</label><input name="destination" required maxlength="120"></div>
    <div style="margin-top:12px"><label>วัตถุประสงค์ *</label><textarea name="purpose" rows="2" required maxlength="200"></textarea></div>
    <div class="f3" style="margin-top:12px">
      <div><label>จำนวนผู้โดยสาร</label><input type="number" name="passengers" min="0" max="60" value="1"></div>
      <div><label>ระยะทางโดยประมาณ (กม.)</label><input type="number" name="distance" min="0" step="0.1"></div>
      <div><label>ยี่ห้อรถ</label><input name="carBrand" id="bkBrand"></div>
    </div>
    <hr style="margin:16px 0;border:0;border-top:1px solid var(--line)">
    <div class="f2">
      <div><label>ผู้ขับขี่ *</label><select name="driverPick" id="bkDriver" required>
        <option value="">— เลือกพนักงานขับรถ —</option>
        <option value="__self">ข้าพเจ้าเป็นผู้ขับขี่เอง</option>
        <option value="__other">อื่น ๆ (ระบุเอง)</option></select></div>
      <div><label>เบอร์โทรผู้ขับขี่</label><input name="driverPhone" id="bkPhone" inputmode="tel" maxlength="15"></div>
    </div>
    <div id="bkOtherWrap" style="margin-top:12px;display:none">
      <label>ชื่อผู้ขับขี่</label><input name="driverOther" maxlength="80">
    </div>
    <div id="conflictBox" class="err" style="margin-top:12px"></div>
    <p class="hint" style="margin-top:8px">* ระบบตรวจสอบการจองซ้อนอัตโนมัติก่อนบันทึก</p>
  </div>
  <div class="ft"><button type="button" class="btn s" data-close>ยกเลิก</button>
    <button class="btn g" id="bkSubmit">💾 ส่งคำขอ</button></div>
</form></div>

<!-- ===== Modal แจ้งคืนรถ ===== -->
<div class="mask" id="mkRet"><form class="modal" id="frmRet" style="max-width:520px" novalidate>
  <div class="hd"><h2>แจ้งคืนรถ</h2><button type="button" class="x" data-close>×</button></div>
  <div class="bd">
    <div id="retInfo" class="card" style="box-shadow:none;background:#f8fafc;margin:0 0 14px"></div>
    <div><label>ผู้แจ้งคืน *</label><input name="returnBy" required maxlength="80"></div>
    <div style="margin-top:12px"><label>เลขไมล์ขากลับ</label><input type="number" name="mileEnd" min="0"></div>
    <div style="margin-top:12px"><label>ระยะทางจริง (กม.)</label><input type="number" name="distance" min="0" step="0.1"></div>
    <div style="margin-top:12px"><label>หมายเหตุ / สภาพรถ</label><textarea name="returnReason" rows="3" maxlength="250"></textarea></div>
  </div>
  <div class="ft"><button type="button" class="btn s" data-close>ปิด</button><button class="btn g">✅ ยืนยันแจ้งคืน</button></div>
</form></div>

<div id="printRoot"></div>
<div id="toastBox"></div>

/* ================= Utils ================= */
const $=(s,r=document)=>r.querySelector(s), $=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const debounce=(f,ms=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const today=()=>new Date().toLocaleDateString('sv-SE');
const MON=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thParts=iso=>{if(!iso)return{d:'',m:'',y:''};const[y,m,d]=String(iso).split('-').map(Number);
  return y?{d:String(d),m:MON[m-1]||'',y:String(y+543)}:{d:'',m:'',y:''}};
const thDate=iso=>{const p=thParts(iso);return p.d?`${p.d} ${p.m} ${p.y}`:'-'};
const thShort=iso=>{if(!iso)return'-';const[y,m,d]=String(iso).split('-');return `${d}/${m}/${+y+543}`};
const hhmm=t=>(t||'').slice(0,5);
const nf=n=>(n===''||n==null||isNaN(n))?'':Number(n).toLocaleString('th-TH');
const rangeOf=b=>{const s=new Date(`${b.date}T${hhmm(b.startTime)||'00:00'}:00`).getTime();
  const e=new Date(`${b.returnDate||b.date}T${hhmm(b.endTime)||'23:59'}:00`).getTime();
  return [s,Math.max(e,s+60000)]};
const overlap=(a,b)=>{const[s1,e1]=rangeOf(a),[s2,e2]=rangeOf(b);return s1<e2&&s2<e1};
function toast(msg,type='ok',ms=2600){const el=document.createElement('div');
  el.className='toast t-'+type;el.textContent=msg;$('#toastBox').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-6px)';setTimeout(()=>el.remove(),250)},ms)}
async function findConflicts(p){
  const snap=await getDocs(query(bookingsCol,where('carId','==',p.carId)));
  const hits=[]; snap.forEach(d=>{const b=d.data();
    if(ACTIVE.includes(b.status)&&overlap(p,b))hits.push({id:d.id,...b})});
  return hits;
}

function autoFit(sheet){
  const p=document.createElement('div');p.style.cssText='position:absolute;visibility:hidden;height:1cm';
  document.body.appendChild(p);const cm=p.getBoundingClientRect().height||37.8;p.remove();
  const max=cm*27.7; let fs=16; sheet.style.setProperty('--fs',fs+'pt');
  const h=()=>sheet.scrollHeight-cm*2;
  while(h()>max&&fs>11){fs=+(fs-0.25).toFixed(2);sheet.style.setProperty('--fs',fs+'pt')}
}
function openPrint(b){
  const root=$('#printRoot');
  const sel=(id,list,cur,ph)=>`<select id="${id}"><option value="">${ph}</option>`+
    list.map(x=>`<option value="${esc(x.name)}"${x.name===cur?' selected':''}>${esc(x.name)}</option>`).join('')+`</select>`;
  root.className='preview';
  root.innerHTML=`<div class="pv-bar"><strong>ผู้ลงนาม:</strong>
    ${sel('pvHead',S.heads,b.signHead||'','ผอ.กอง/ผู้แทน —')}
    ${sel('pvDele',S.delegates,b.signDelegate||'','ผู้สั่งใช้รถแทน —')}
    ${sel('pvAppr',S.approvers,b.signApprover||'','ผู้อนุมัติ —')}
    <span class="sp"></span>
    <button id="pvPrint" style="background:#16a34a;color:#fff">🖨️ พิมพ์</button>
    <button id="pvClose" style="background:#64748b;color:#fff">ปิด</button></div><div id="pvBody"></div>`;
  const draw=()=>{$('#pvBody').innerHTML=buildForm(b,{head:$('#pvHead').value,
      delegate:$('#pvDele').value,approver:$('#pvAppr').value}); autoFit($('#sheet'))};
  ['pvHead','pvDele','pvAppr'].forEach(i=>$('#'+i).onchange=draw);
  $('#pvPrint').onclick=()=>window.print();
  $('#pvClose').onclick=closePrint;
  document.addEventListener('keydown',escClose);
  document.body.style.overflow='hidden'; draw();
}
const escClose=e=>{if(e.key==='Escape')closePrint()};
function closePrint(){const r=$('#printRoot');r.className='';r.innerHTML='';
  document.removeEventListener('keydown',escClose);document.body.style.overflow=''}

let curCar=null;
function openBooking(id){
  curCar=carById(id); if(!curCar)return;
  const F=$('#frmBook'); F.reset();
  $('#bkTitle').textContent=`จอง ${curCar.name} (${curCar.license})`;
  $('#bkBrand').value=curCar.brand||'';
  const d=$('#fDate').value||today();
  F.date.value=F.returnDate.value=d; F.startTime.value='08:30'; F.endTime.value='16:30';
  $('#bkOtherWrap').style.display='none'; $('#conflictBox').classList.remove('on');
  $('#mkBook').classList.add('on'); setTimeout(()=>F.userName.focus(),60);
}
$('#bkDriver').onchange=e=>{const v=e.target.value;
  $('#bkOtherWrap').style.display=v==='__other'?'block':'none';
  if(v==='__self')$('#bkPhone').value=''; else if(v&&v!=='__other')$('#bkPhone').value=DRIVERS[+v]?.phone||''};
$('#frmBook').addEventListener('submit',async e=>{
  e.preventDefault(); const F=$('#frmBook'); if(!F.reportValidity())return;
  const f=new FormData(F), g=k=>(f.get(k)||'').toString().trim(), btn=$('#bkSubmit');
  const p={carId:curCar.id,carName:curCar.name,carBrand:g('carBrand')||curCar.brand,carLicense:curCar.license,
    userName:g('userName'),userPosition:g('userPosition'),date:g('date'),startTime:g('startTime'),
    returnDate:g('returnDate')||g('date'),endTime:g('endTime'),destination:g('destination'),purpose:g('purpose'),
    passengers:+g('passengers')||0,distance:g('distance')===''?'':+g('distance'),status:ST.WAIT};
  const [s,en]=rangeOf(p);
  if(en<=s){$('#errTime').classList.add('on');return} $('#errTime').classList.remove('on');
  const pick=g('driverPick');
  if(pick==='__self'){p.driverName=p.userName;p.driverPhone=g('driverPhone')}
  else if(pick==='__other'){p.driverName=g('driverOther');p.driverPhone=g('driverPhone');
    if(!p.driverName){toast('กรุณาระบุชื่อผู้ขับขี่','warn');return}}
  else {p.driverName=DRIVERS[+pick].name;p.driverPhone=DRIVERS[+pick].phone}
  btn.disabled=true; btn.textContent='⏳ กำลังตรวจสอบ...';
  try{
    const hit=await findConflicts(p);
    if(hit.length){
      $('#conflictBox').innerHTML='⛔ รถคันนี้มีคิวซ้อน:<br>'+hit.map(h=>
        `• ${esc(h.userName)} ${thShort(h.date)} ${hhmm(h.startTime)}–${hhmm(h.endTime)} น. (${esc(h.status)})`).join('<br>');
      $('#conflictBox').classList.add('on');
      toast('มีการจองซ้อน กรุณาเลือกเวลาหรือรถคันอื่น','bad',4000); return;
    }
    p.timestamp=serverTimestamp(); p.isLineSent=false;
    await addDoc(bookingsCol,p);
    $('#mkBook').classList.remove('on'); toast('ส่งคำขอเรียบร้อย รอเจ้าหน้าที่อนุมัติ','ok');
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message,'bad',5000)}
  finally{btn.disabled=false;btn.textContent='💾 ส่งคำขอ'}
});

/* ================= Event delegation ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-book],[data-print],[data-ret],[data-cancel],[data-close]');
  if(!t)return; const d=t.dataset;
  if(d.close!==undefined){t.closest('.mask').classList.remove('on');return}
  if(d.book!==undefined) openBooking(d.book);
  if(d.print){const b=byId(d.print); b&&openPrint(b)}
  if(d.ret) openReturn(d.ret);
  if(d.cancel) cancelReq(d.cancel);
});
$('.mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('.mask.on').forEach(m=>m.classList.remove('on'))});
</script>
